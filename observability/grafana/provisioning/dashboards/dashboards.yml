apiVersion: 1

providers:
  - name: pow-dashboards
    orgId: 1
    folder: POW
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards

  # This Prometheus/Grafana instance now serves both POW and Wren (Atria's
  # other product, github.com/atriasfty/wren) — separate folder to keep
  # their dashboards visually distinct. Source of truth for Wren's own
  # dashboards is still this repo (POW's), since that's where the shared
  # stack lives; wren's repo just points here.
  - name: wren-dashboards
    orgId: 1
    folder: Wren
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/wren-dashboards

  # General server/host stats that aren't specific to POW or Wren (both
  # boxes are shared with unrelated tenants) — kept out of the POW folder
  # on purpose, same reasoning as the separate Wren folder above.
  - name: infra-dashboards
    orgId: 1
    folder: Infrastructure
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/infra-dashboards
