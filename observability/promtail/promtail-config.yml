server:
  # 9080 (Promtail's default) is already bound by something else on this box —
  # rebind off the default.
  http_listen_address: 127.0.0.1
  http_listen_port: 19080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push

scrape_configs:
  - job_name: pow-pm2
    static_configs:
      - targets: [localhost]
        labels:
          job: pow
          __path__: /var/log/pow-pm2/pow-*-{prod,staging}-{out,error}.log
    pipeline_stages:
      # service/env/stream come from the filename — works for every line
      # regardless of content, which matters because only the dashboard
      # (dashboard/src/lib/logger.ts) emits structured JSON; the bot and
      # sync-server still use plain console.log/console.error.
      - regex:
          source: filename
          expression: '/pow-(?P<service>dashboard|bot|sync)-(?P<env>prod|staging)-(?P<stream>out|error)\.log$'
      - labels:
          service:
          env:
          stream:
      # Additional labels when the line IS one of logger.ts's JSON objects
      # ({ts, level, component, msg, ...}) — a no-op (silently skipped) on
      # the bot/sync-server's plain-text lines.
      - json:
          expressions:
            level: level
            component: component
            ts: ts
      - labels:
          level:
          component:
      - timestamp:
          source: ts
          format: RFC3339
          fallback_formats:
            - RFC3339Nano
