# Routes all POW alerts to the dashboard's /api/internal/infra-alert relay,
# which forwards them through the app's existing sendAlert() cooldown/dedup
# logic onto the separate "infra" Discord channel (INFRA_ALERT_DISCORD_WEBHOOK_URL).
# One flood-control system (sendAlert()'s per-key cooldown), not two.

route:
  receiver: pow-relay
  group_by: [alertname, server_id]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: pow-relay
    webhook_configs:
      - url: http://127.0.0.1:41729/api/internal/infra-alert
        send_resolved: true
        http_config:
          authorization:
            credentials_file: /etc/alertmanager/secrets/infra-alert.token
