groups:
  - name: pow-critical
    rules:
      - alert: SyncPipelineStale
        expr: (time() - pow_last_sync_timestamp_seconds) > 90
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Sync pipeline stale >90s for server {{ $labels.server_id }}"
          description: "No successful sync cycle for server {{ $labels.server_id }} in over 90 seconds. Mod panels for this server are stale."

      - alert: BotGatewayDisconnected
        expr: pow_bot_gateway_status != 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Bot disconnected from Discord gateway"
          description: "pow_bot_gateway_status has been non-zero (not READY) for over 2 minutes. Slash commands and log-sync triggering are down."

      - alert: DashboardDown
        expr: up{job="pow-dashboard-prod"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Dashboard process is down"
          description: "Prometheus can't scrape pow-dashboard-prod — the process is down or unresponsive."

      - alert: PM2ProcessDown
        expr: up{job=~"pow-.*"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus target {{ $labels.job }} has been unreachable for over 2 minutes."

      - alert: WrenDown
        expr: up{job="wren-prod"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Wren process is down"
          description: "Prometheus can't scrape wren-prod — the process is down or unresponsive."

      - alert: WrenGatewayDisconnected
        expr: wren_discord_gateway_status != 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Wren disconnected from Discord gateway"
          description: "wren_discord_gateway_status has been non-zero (not READY) for over 2 minutes. Chat/voice/slash commands are down for every tenant guild."

  - name: pow-warning
    rules:
      - alert: HostMemoryPressure
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }}: memory available <5%"
          description: "Available memory on {{ $labels.host }} has been under 5% of total for 5+ minutes."

      - alert: HostDiskPressure
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }}: disk free <10%"
          description: "Free disk space on / on {{ $labels.host }} has been under 10% for 10+ minutes."

      - alert: HostNodeExporterDown
        # Base-layer alert: if this fires, HostMemoryPressure/HostDiskPressure
        # also go silently blind for that host (no data to evaluate against).
        expr: up{job="node"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "node_exporter down on {{ $labels.host }}"
          description: "Prometheus can't scrape node_exporter on {{ $labels.host }} for 5+ minutes — CPU/mem/disk visibility for this box is blind. If this is atria1, check its Tailscale connection (tailscale status on either box) and the container (cd /root/node-exporter && docker compose ps, on atria1 itself)."

      - alert: BotQueueBacklog
        expr: pow_bot_queue_oldest_age_seconds > 120
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Bot outbound queue backlogged"
          description: "Oldest pending bot-queue item is over 2 minutes old — Discord messages/DMs/role changes are delayed."

      - alert: PM2RestartLoop
        # Scoped to our own app processes — pow_pm2_restart_total also
        # covers PM2 modules (pm2-logrotate) and unrelated tenants sharing
        # this box, which restart more often for routine reasons (module
        # reinstalls, PM2 daemon reloads) and aren't ours to alert on.
        expr: increase(pow_pm2_restart_total{name=~"pow-.*|wren"}[10m]) > 3
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.name }} restarting repeatedly"
          description: "{{ $labels.name }} has restarted more than 3 times in the last 10 minutes — likely crash-looping."

      - alert: WrenChatPipelineErrorRate
        expr: rate(wren_chat_pipeline_errors_total[10m]) > 0.1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Wren chat pipeline error rate elevated"
          description: "wren_chat_pipeline_errors_total has been climbing at over 0.1/s (~1 in 10 requests failing) for 5+ minutes — check LLM provider status and recent deploys."

      - alert: EventLoopLagHigh
        # p99 event loop lag has been tracked on all 4 Node processes
        # (dashboard/bot/sync-server/wren, see nodejs-runtime.json and
        # wren-overview.json) since early on, but nothing ever alerted on
        # it — sustained lag here means the process is blocking on
        # synchronous work and every request queues up behind it.
        expr: pow_dashboard_nodejs_eventloop_lag_p99_seconds > 0.5 or pow_bot_nodejs_eventloop_lag_p99_seconds > 0.5 or pow_sync_nodejs_eventloop_lag_p99_seconds > 0.5 or wren_nodejs_eventloop_lag_p99_seconds > 0.5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Node.js event loop lag elevated"
          description: "p99 event loop lag has been over 500ms for 5+ minutes on one of dashboard/bot/sync-server/wren — check nodejs-runtime.json / wren-overview.json to see which, and look for a synchronous/blocking call in recently deployed code."

      - alert: PublicApiErrorRate
        # public/v1/* is the paid public API surface — an elevated 5xx rate
        # here is customer-visible, not just an internal blip.
        expr: sum(rate(pow_http_request_duration_seconds_count{route=~"public/v1/.*", status=~"5.."}[10m])) / sum(rate(pow_http_request_duration_seconds_count{route=~"public/v1/.*"}[10m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Public API 5xx rate elevated"
          description: "Over 5% of public/v1/* requests have returned 5xx for 5+ minutes. Check recent deploys and PRC/DB health — this is the paid public API, not an internal route."

      - alert: AutomationFailureRate
        expr: sum(rate(pow_automation_executions_total{outcome="error"}[15m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Automation engine failure rate elevated"
          description: "Automation trigger processing has been failing at over 0.05/s (~3/min) for 5+ minutes. Check recent automation config changes and PRC connectivity."

      - alert: McpToolErrorRate
        expr: sum(rate(wren_mcp_tool_calls_total{outcome="error"}[10m])) / sum(rate(wren_mcp_tool_calls_total[10m])) > 0.15
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Wren MCP tool-call error rate elevated"
          description: "Over 15% of Wren tool calls have failed for 5+ minutes. Check PRC/Discord API health and recent tool changes in executor.js."

      - alert: PrcKeyInvalidServers
        expr: pow_prc_key_invalid_servers > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} server(s) have an invalid PRC key"
          description: "At least one server has had an invalid PRC Server-Key for 5+ minutes and sync has stopped for it. A per-server Discord alert already fired when this started — this is the aggregate view. Check the mod/admin panel banner or query pow_prc_key_invalid_servers to see which."

      - alert: AlertDeliveryFailing
        # If this fires, don't trust Discord to have told you already —
        # check Grafana/Prometheus directly. Covers dashboard, bot, and
        # sync-server's independent sendAlert() implementations.
        expr: increase(pow_alert_send_failures_total[15m]) + increase(pow_bot_alert_send_failures_total[15m]) + increase(pow_sync_alert_send_failures_total[15m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Discord alert delivery is failing"
          description: "One or more sendAlert() calls failed to reach Discord in the last 15 minutes (bad webhook URL, Discord outage, rate limit). Other alerts may be silently not reaching you — check webhook config and Discord status directly."

      - alert: ObservabilityComponentDown
        # Loki/Alertmanager/Promtail/Grafana dying previously went completely
        # unnoticed — only the app jobs and node/prometheus itself were
        # watched. This alert fires via Alertmanager -> infra-alert route ->
        # Discord, same as everything else, UNLESS Alertmanager itself is the
        # thing that's down, in which case nothing fires and this stays a
        # blind spot — check Grafana/Prometheus directly if alerts go quiet.
        expr: up{job=~"alertmanager|loki|promtail|grafana"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }} (observability stack component) is down"
          description: "Prometheus target {{ $labels.job }} has been unreachable for 5+ minutes. Part of the observability stack itself is degraded — logs, dashboards, or alert routing may be affected."

  - name: infra-system
    rules:
      - alert: BackupStale
        # Threshold is generous (2 days) to avoid false positives on a quiet
        # weekend — this is meant to catch "backups have silently stopped
        # working for a long time" (postgres_replica was found stale by 32
        # days when this alert was first built, from a stale SSH key on
        # atria1 — fixed 2026-08-14), not flag every missed cron tick.
        expr: (time() - pow_backup_last_file_timestamp_seconds) > 172800
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: "Backup job \"{{ $labels.backup_job }}\" on {{ $labels.host }} hasn't produced a fresh file in 2+ days"
          description: "pow_backup_last_file_timestamp_seconds for backup_job={{ $labels.backup_job }} host={{ $labels.host }} is over 48h old (0 means no matching file was ever found). Check the source cron job's logs directly — a silently-broken backup is worse than no monitoring at all."

      - alert: SystemdUnitFailed
        expr: pow_systemd_failed_units > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }}: {{ $value }} systemd unit(s) in failed state"
          description: "systemctl --failed has reported at least one failed unit on {{ $labels.host }} for 10+ minutes. Run `systemctl --failed` on that host to see which."

      - alert: TailscaleDown
        # Critical, not warning — atria1's ENTIRE node_exporter scrape (and
        # everything on the Server Health dashboard for that host) depends on
        # this daemon staying up. If this fires, HostNodeExporterDown will
        # likely follow shortly after for the same host.
        expr: pow_tailscale_up == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Tailscale daemon down on {{ $labels.host }}"
          description: "{{ $labels.host }}'s Tailscale backend has not reported BackendState=Running for 5+ minutes. If this is atria1, its node_exporter scrape from atria2 will likely fail next."

      - alert: HostCpuHigh
        expr: (100 - (avg by (host) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 90
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }}: CPU busy >90%"
          description: "Average CPU utilization across all cores on {{ $labels.host }} has been over 90% for 15+ minutes. Check for a runaway process (top/htop), a stuck sync/automation loop, or a noisy-neighbor tenant on this shared box."

      - alert: HostSwapThrashing
        # Rate of pages actively moving in+out, not just static swap usage —
        # this is the "the box is in real trouble right now" signal. atria1
        # already sits around 60% swap used at baseline (tight RAM, see
        # host-resources.json), so a static-usage threshold alone would be
        # noisy; sustained swap I/O is what actually indicates thrashing.
        expr: (rate(node_vmstat_pswpin[5m]) + rate(node_vmstat_pswpout[5m])) > 200
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }}: swap thrashing"
          description: "Pages have been swapped in+out at over 200/s sustained for 10+ minutes on {{ $labels.host }} — active memory pressure, not just static swap usage. Check `free -h` and `ps aux --sort=-%mem | head`."

      - alert: HostSwapPressure
        expr: (1 - (node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes)) > 0.9
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }}: swap >90% full"
          description: "Swap on {{ $labels.host }} has been over 90% used for 30+ minutes — little headroom left before an OOM-killer scenario. Evaluates to false (never fires) on hosts with no swap configured."

      - alert: HostDiskIoSaturation
        expr: rate(node_disk_io_time_seconds_total{device!~"sr[0-9]+|loop[0-9]+"}[5m]) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }}: disk {{ $labels.device }} saturated"
          description: "Block device {{ $labels.device }} on {{ $labels.host }} has been busy over 90% of the time for 10+ minutes — disk throughput is a bottleneck. Often correlates with HostSwapThrashing on a memory-tight box."

  - name: infra-app-probes
    rules:
      - alert: VoiceSttTtsErrorRate
        expr: rate(wren_voice_stt_errors_total[15m]) > 0.05 or rate(wren_voice_tts_errors_total[15m]) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Wren voice pipeline (STT/TTS) error rate elevated"
          description: "Speech-to-text or text-to-speech calls have been failing at over 0.05/s for 5+ minutes — check OpenRouter status for the Parakeet/Kokoro models."

      - alert: WebhookDeliveryFailing
        expr: increase(pow_webhook_delivery_failures_total[30m]) > 5
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Outbound automation webhook deliveries failing"
          description: "More than 5 webhook delivery failures in the last 30 minutes — server-configured automation webhooks aren't reaching their destination."

      - alert: McpAuthFailureSpike
        expr: increase(wren_mcp_auth_failures_total[15m]) > 20
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Wren external MCP endpoint: auth failure spike"
          description: "Over 20 MCP auth failures in 15 minutes — possible token brute-forcing against the external MCP server endpoint."
