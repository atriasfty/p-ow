global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  # Ports confirmed from the live process list on prod — note the bot's is
  # 41732, not 41734 as CLAUDE.md's stale docs implied. Token files under
  # ./secrets/*.token (gitignored) hold PROMETHEUS_METRICS_SECRET's value —
  # one shared secret across the three processes, same as INTERNAL_SYNC_SECRET.
  #
  # No `service:` static label here — `job` already identifies the process
  # (pow-dashboard-prod/pow-bot-prod/pow-sync-prod), and pow_api_call_* /
  # pow_db_query_* metrics have their OWN `service` label (prc/clerk/rotector/
  # pow-api/db model name). A static label with the same name as a metric's
  # own label gets relabeled to `exported_service` by Prometheus to resolve
  # the collision — which silently broke every `service="prc"`-style query,
  # including Grafana's API Dependencies dashboard. Don't reintroduce this.

  - job_name: pow-dashboard-prod
    metrics_path: /api/metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/dashboard_prod.token
    static_configs:
      - targets: ["127.0.0.1:41729"]
        labels: { env: prod }

  - job_name: pow-bot-prod
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/bot_prod.token
    static_configs:
      - targets: ["127.0.0.1:41732"]
        labels: { env: prod }

  - job_name: pow-sync-prod
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/sync_prod.token
    static_configs:
      - targets: ["127.0.0.1:41730"]
        labels: { env: prod }

  # Staging isn't currently deployed on this box (no pow-*-staging PM2
  # processes at last check) — add pow-dashboard-staging/pow-bot-staging/
  # pow-sync-staging jobs the same way once it is, confirming actual
  # staging ports first rather than assuming CLAUDE.md's documented ones.

  # --- Wren (github.com/atriasfty/wren) — Atria's other product, also
  # running on this box. This Prometheus/Grafana instance serves both.
  # Commented until wren has actually been redeployed with the metrics code
  # (WREN_METRICS_SECRET doesn't exist yet, so ./secrets/wren_prod.token
  # can't be populated) — Prometheus fails to load its whole config if a
  # referenced credentials_file doesn't exist, which would take down
  # scraping for POW too. Uncomment once the token file is in place.
  # - job_name: wren-prod
  #   metrics_path: /metrics
  #   authorization:
  #     credentials_file: /etc/prometheus/secrets/wren_prod.token
  #   static_configs:
  #     - targets: ["127.0.0.1:4167"]
  #       labels: { env: prod }
