global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  # Ports confirmed from the live process list on prod — note the bot's is
  # 41732, not 41734 as CLAUDE.md's stale docs implied. Token files under
  # ./secrets/*.token (gitignored) hold PROMETHEUS_METRICS_SECRET's value —
  # one shared secret across the three processes, same as INTERNAL_SYNC_SECRET.

  - job_name: pow-dashboard-prod
    metrics_path: /api/metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/dashboard_prod.token
    static_configs:
      - targets: ["127.0.0.1:41729"]
        labels: { env: prod, service: dashboard }

  - job_name: pow-bot-prod
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/bot_prod.token
    static_configs:
      - targets: ["127.0.0.1:41732"]
        labels: { env: prod, service: bot }

  - job_name: pow-sync-prod
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/sync_prod.token
    static_configs:
      - targets: ["127.0.0.1:41730"]
        labels: { env: prod, service: sync }

  # Staging isn't currently deployed on this box (no pow-*-staging PM2
  # processes at last check) — add pow-dashboard-staging/pow-bot-staging/
  # pow-sync-staging jobs the same way once it is, confirming actual
  # staging ports first rather than assuming CLAUDE.md's documented ones.
